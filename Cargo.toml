[package]
name = "atlas_priority_fee_estimator"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-sdk = "4.0.1"
solana-client = "4.2.1"
solana-account-decoder = "4.1.2"
solana-transaction-status = { version = "4.1.2", features = ["agave-unstable-api"] }
solana-message = "4.1.1"
# `wincode` carries the unified legacy/V0/V1 transaction deserializer; V1
# (SIMD-0385) is not readable via bincode.
solana-transaction = { version = "4.1.1", features = ["wincode"] }
solana-pubkey = "4.2.0"
solana-clock = "3.0.1"
solana-transaction-error = "3.2.0"
# Replaces solana-program-runtime's ComputeBudget / PrioritizationFeeDetails,
# which no longer exist in 4.x.
solana-compute-budget = "4.1.2"
solana-compute-budget-instruction = "4.1.2"
solana-svm-transaction = "4.2.0"
agave-feature-set = "4.2.1"
crossbeam-channel = "0.5.6"
tokio = { version = "1.25.0", features = ["full"] }
csv = "1.3.0"
cadence = "0.29.0"
cadence-macros = "0.29.0"
dashmap = "5.5.3"
queues = "1.1.0"
jsonrpsee = { version = "0.22.5", features = [
    "server",
    "http-client",
    "macros",
] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = [
    "json",
    "env-filter",
    "ansi",
] }
tracing-appender = "0.2.3"
serde = { version = "1.0.190", features = ["derive"] }
base64 = "0.21.6"
bs58 = "0.5.1"
wincode = "0.5.5"
# Branch carries SIMD-0385 v1 support: `Message.config` (field 7) on the wire
# plus the SanitizedMessage::V1 conversion. Same branch laserstream pins.
yellowstone-grpc-proto = { git = "https://github.com/helius-labs/yellowstone-grpc", branch = "subscribe-raw-client-with-unconfirmed-v9.0.1" }
yellowstone-grpc-client = { git = "https://github.com/helius-labs/yellowstone-grpc", branch = "subscribe-raw-client-with-unconfirmed-v9.0.1" }
rand = "0.8.5"
futures = "0.3.24"
figment = { version = "0.10.6", features = ["env", "test"] }
tower = { version = "0.4.13", features = ["full"] }
thiserror = "1.0.63"
anyhow = "1.0.86"
statrs = "0.17.1"

[dev-dependencies]
# `pack()` on ComputeBudgetInstruction sits behind dev-context-only-utils.
solana-compute-budget-interface = { version = "3.0.0", features = [
    "dev-context-only-utils",
] }
